<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale breach, made in Blender by code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6ece0; --dim: rgba(246, 236, 224, .46); --ember: #ffb072; --sea: #8fd3d6; --gold: #ffd9a3;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #140c08; overflow: hidden; color: var(--ink); }
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; background: #140c08; }
  #stage.drag { cursor: grabbing; }
  #film {
    position: absolute; inset: -1.5%; width: 103%; height: 103%; object-fit: cover; object-position: 30% 50%;
    will-change: transform; transition: transform .5s cubic-bezier(.2, .7, .2, 1);
  }
  #dip { position: absolute; inset: 0; background: #140c08; opacity: 0; pointer-events: none; }

  /* the script, beside the film */
  #code {
    position: absolute; top: 0; right: 0; bottom: 0; width: clamp(420px, 40vw, 800px);
    background: linear-gradient(90deg, rgba(16, 10, 8, 0) 0%, rgba(16, 10, 8, .10) 8%, rgba(16, 10, 8, .34) 18%,
                rgba(15, 9, 8, .62) 30%, rgba(14, 9, 8, .80) 46%, rgba(14, 9, 8, .88) 100%);
    transition: transform .6s cubic-bezier(.2, .7, .2, 1), opacity .6s; font-family: var(--mono);
  }
  body.film-only #code { transform: translateX(100%); opacity: 0; }
  #head { position: absolute; top: 0; left: 0; right: 0; padding: 30px 34px 0 26%; z-index: 2; }
  #file { font: 500 13px/1 var(--mono); letter-spacing: .02em; color: var(--ink); }
  #count { font: 400 clamp(30px, 2.5vw, 44px)/1.05 var(--serif); margin-top: 12px; color: var(--gold); letter-spacing: -.01em; }
  #count small { display: block; font: 400 12px/1.5 var(--mono); color: var(--dim); letter-spacing: .02em; margin-top: 8px; }
  #now { font: 400 12px/1.4 var(--mono); color: var(--ember); margin-top: 16px; min-height: 17px; transition: opacity .3s; }
  #now::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); margin-right: 9px; transform: translateY(-1px); }
  #view {
    position: absolute; top: 178px; bottom: 0; left: 0; right: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 84%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 84%, transparent 100%);
  }
  #lines { position: absolute; top: 0; left: 0; right: 0; padding-left: calc(26% - 60px); will-change: transform; }
  #view::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 90px; background: linear-gradient(90deg, rgba(14, 9, 8, 0), rgba(14, 9, 8, .96)); }
  .ln { display: flex; height: 19px; font: 400 11.5px/19px var(--mono); white-space: pre; color: rgba(246, 236, 224, .80); }
  .ln i { flex: 0 0 44px; font-style: normal; color: rgba(246, 236, 224, .22); text-align: right; padding-right: 16px; user-select: none; }
  .ln.def { color: #fff; }
  .ln.def i { color: var(--ember); }
  .ln.on { background: linear-gradient(90deg, rgba(255, 176, 114, .20), rgba(255, 176, 114, 0) 85%); }
  .k { color: var(--ember); } .s { color: var(--sea); } .c { color: rgba(246, 236, 224, .40); font-style: italic; }
  .n { color: var(--gold); } .f { color: #fff; font-weight: 700; }

  #bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--ember); transform-origin: 0 50%; transform: scaleX(0); opacity: 0; transition: opacity .5s; }
  body.awake #bar { opacity: .85; }
  #sound {
    position: absolute; left: 28px; bottom: 26px; font: 500 12px/1 var(--mono); letter-spacing: .02em; color: var(--ink);
    background: rgba(20, 12, 8, .42); border: 1px solid rgba(246, 236, 224, .34); border-radius: 999px; padding: 11px 16px 11px 14px;
    cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .2s, border-color .2s;
  }
  #sound:hover, #sound:focus-visible { background: rgba(20, 12, 8, .7); border-color: var(--ember); outline: none; }
  #sound b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); margin-right: 9px; }
  #sound.on b { background: var(--ember); border-color: var(--ember); }
  @media (max-width: 760px) { #code { width: 100%; top: 52%; background: linear-gradient(180deg, rgba(16,10,8,0), rgba(14,9,8,.9) 22%); } #head { padding-left: 24px; } #lines { padding-left: 4px; } }
  @media (prefers-reduced-motion: reduce) { #film { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <video id="film" src="film/whale.mp4" muted loop autoplay playsinline preload="auto"></video>
  <div id="dip"></div>
  <aside id="code" aria-label="The Python script that made the film">
    <div id="head">
      <div id="file">whale_breach.py</div>
      <div id="count"><span id="nlines">0</span> lines of Python<small>made every frame of this film in Blender</small></div>
      <div id="now"></div>
    </div>
    <div id="view"><div id="lines"></div></div>
  </aside>
  <div id="bar"></div>
  <button id="sound" type="button" aria-pressed="false"><b></b><span>Enable sound</span></button>
</div>
<script src="film/script.js"></script>
<script>
(function () {
  'use strict';
  var DUR = 9.0, FPS = 24, LINE = 19;
  var q = new URLSearchParams(location.search);
  var frozen = q.has('t') ? Math.max(0, Math.min(DUR - 0.001, parseFloat(q.get('t')) || 0)) : null;
  var film = document.getElementById('film'), stage = document.getElementById('stage');
  var linesEl = document.getElementById('lines'), viewEl = document.getElementById('view');
  var nowEl = document.getElementById('now'), bar = document.getElementById('bar'), dip = document.getElementById('dip');
  if (q.get('view') === 'film') document.body.classList.add('film-only');

  // ---------------------------------------------------------- the script, coloured
  var src = (window.WHALE_SRC || '# script not found').replace(/\s+$/, '').split('\n');
  document.getElementById('nlines').textContent = src.length;
  var KW = /^(def|class|return|for|in|if|else|elif|while|import|from|as|lambda|try|except|pass|global|and|or|not|None|True|False|with|break)$/;
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function paint(line, st) {
    var out = '', i = 0, m;
    while (i < line.length) {
      var rest = line.slice(i);
      if (st.doc) {
        var e = rest.indexOf('"""');
        if (e < 0) { out += '<span class="s">' + esc(rest) + '</span>'; break; }
        out += '<span class="s">' + esc(rest.slice(0, e + 3)) + '</span>'; i += e + 3; st.doc = false; continue;
      }
      if (rest.slice(0, 3) === '"""') {
        var e2 = rest.indexOf('"""', 3);
        if (e2 < 0) { out += '<span class="s">' + esc(rest) + '</span>'; st.doc = true; break; }
        out += '<span class="s">' + esc(rest.slice(0, e2 + 3)) + '</span>'; i += e2 + 3; continue;
      }
      if (rest[0] === '#') { out += '<span class="c">' + esc(rest) + '</span>'; break; }
      if ((m = /^('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")/.exec(rest))) { out += '<span class="s">' + esc(m[0]) + '</span>'; i += m[0].length; continue; }
      if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
        var w = m[0], prev = /(def|class)\s+$/.test(line.slice(0, i));
        out += prev ? '<span class="f">' + w + '</span>' : KW.test(w) ? '<span class="k">' + w + '</span>' : w;
        i += w.length; continue;
      }
      if ((m = /^\d[\d._e]*/.exec(rest))) { out += '<span class="n">' + m[0] + '</span>'; i += m[0].length; continue; }
      out += esc(rest[0]); i++;
    }
    return out;
  }
  var st = { doc: false }, html = [], defs = {}, defOrder = [];
  src.forEach(function (line, n) {
    var m = /^(?:def|class) ([A-Za-z_0-9]+)/.exec(line);
    if (m) { defs[m[1]] = n; defOrder.push(n); }
    html.push('<div class="ln' + (m ? ' def' : '') + '" data-n="' + n + '"><i>' + (n + 1) + '</i><span>' + paint(line, st) + '</span></div>');
  });
  linesEl.innerHTML = html.join('');
  var rows = linesEl.children;

  // ---------------------------------------------------------- which code is on screen now
  var BEATS = [
    { t: 0.0, say: 'The sea and the sunrise', fn: ['build_sea', 'build_sky', 'sea_material'] },
    { t: 1.0, say: 'The breach, as numbers', fn: ['whale_state', 'camera_state', 'apply_time'] },
    { t: 2.0, say: 'The whale’s body', fn: ['build_whale_data', 'body_surface', 'pose_whale'] },
    { t: 3.3, say: 'Skin, pleats and scars', fn: ['whale_material', 'profile', 'spine_bend'] },
    { t: 4.25, say: 'The wall of spray', fn: ['make_spray', 'make_spray', 'make_spray'] },
    { t: 6.0, say: 'Every drop, every frame', fn: ['spray_frame', 'sun_shade', 'build_spray'] },
    { t: 7.5, say: 'The colour grade', fn: ['build_grade', 'setup', 'main'] }
  ];
  function beatAt(t) { var b = 0; for (var i = 0; i < BEATS.length; i++) if (t >= BEATS[i].t) b = i; return b; }
  function fnLength(n) { var k = defOrder.indexOf(n), end = k + 1 < defOrder.length ? defOrder[k + 1] : src.length; return end - n; }

  var loop = 0, lastT = 0, scrollY = 0, userUntil = 0, userY = 0, curDef = -1;
  function targetLine(t) {
    var b = beatAt(t), beat = BEATS[b], name = beat.fn[loop % beat.fn.length];
    var n = defs[name] != null ? defs[name] : 0, len = fnLength(n);
    var round = Math.floor(loop / beat.fn.length);
    var into = (t - beat.t) * 2.6 + (beat.fn[0] === beat.fn[1] ? loop : round) * 22;     // read on, a little further each loop
    return { line: n + (len > 12 ? into % Math.max(len - 8, 1) : 0), def: n, say: beat.say, name: name };
  }
  function showCode(t, dt, snap) {
    var tg = targetLine(t), want = tg.line * LINE - viewEl.clientHeight * 0.16;
    var now = performance.now();
    if (now < userUntil) want = userY;
    var maxY = Math.max(0, src.length * LINE - viewEl.clientHeight * 0.5);
    want = Math.max(-viewEl.clientHeight * 0.1, Math.min(maxY, want));
    scrollY = snap ? want : scrollY + (want - scrollY) * (1 - Math.exp(-dt * 5.5));
    linesEl.style.transform = 'translate3d(0,' + (-scrollY).toFixed(1) + 'px,0)';
    if (tg.def !== curDef) {
      if (curDef >= 0) rows[curDef].classList.remove('on');
      rows[tg.def].classList.add('on'); curDef = tg.def;
      nowEl.textContent = tg.say + '  ·  ' + tg.name + '()';
    }
  }

  // ---------------------------------------------------------- sound, made in code, silent until asked
  var AC = null, bus = {}, soundOn = false, lastThump = -1;
  function startSound() {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    var len = AC.sampleRate * 4, buf = AC.createBuffer(2, len, AC.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch), b = 0;
      for (var i = 0; i < len; i++) { var w = Math.random() * 2 - 1; b = (b + 0.03 * w) / 1.03; d[i] = w * 0.35 + b * 2.4; }
    }
    var master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    master.gain.setTargetAtTime(0.9, AC.currentTime, 0.4);
    function layer(type, freq, qv) {
      var s = AC.createBufferSource(); s.buffer = buf; s.loop = true; s.playbackRate.value = 0.8 + Math.random() * 0.4;
      var f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = qv || 0.7;
      var g = AC.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(master); s.start();
      return { f: f, g: g };
    }
    bus = { master: master, sea: layer('lowpass', 420), hiss: layer('highpass', 3200), rush: layer('bandpass', 700, 0.9),
            crash: layer('lowpass', 2400), rain: layer('highpass', 5200) };
  }
  function thump() {
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.frequency.setValueAtTime(74, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.7);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.85, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(g); g.connect(bus.master); o.start(t); o.stop(t + 1.4);
  }
  function sm(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  function mixSound(t, playing) {
    if (!AC) return;
    var now = AC.currentTime, k = playing ? 1 : 0.35, swell = 0.5 + 0.5 * Math.sin(now * 0.9) * Math.sin(now * 0.37 + 1);
    function set(n, v, tc) { bus[n].g.gain.setTargetAtTime(v, now, tc || 0.08); }
    set('sea', 0.30 + 0.16 * swell, 0.3);
    set('hiss', 0.012 + 0.02 * swell, 0.3);
    var rise = sm(0.9, 2.2, t) * (1 - sm(2.6, 4.0, t));
    set('rush', k * 0.34 * rise); bus.rush.f.frequency.setTargetAtTime(500 + 1500 * rise, now, 0.1);
    var hit = t > 4.25 ? Math.exp(-(t - 4.25) * 0.85) * sm(4.2, 4.45, t) : 0;
    set('crash', k * 1.0 * hit, 0.05); bus.crash.f.frequency.setTargetAtTime(500 + 5200 * hit, now, 0.08);
    set('rain', k * 0.20 * sm(4.6, 5.6, t) * (1 - sm(7.0, 9.0, t)), 0.2);
    if (playing && t >= 4.3 && lastThump < 4.3) thump();
    lastThump = t;
  }
  var soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!AC) startSound();
    soundOn = !soundOn;
    if (soundOn) AC.resume(); else AC.suspend();
    soundBtn.classList.toggle('on', soundOn); soundBtn.setAttribute('aria-pressed', soundOn);
    soundBtn.lastElementChild.textContent = soundOn ? 'Sound on' : 'Enable sound';
  });
  soundBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  // ---------------------------------------------------------- input: look around, scrub, step, read
  var px = 0, py = 0, dragging = false, dragX = 0, dragT = 0, wasPlaying = true, moved = false, paused = frozen != null;
  function wake() { document.body.classList.add('awake'); clearTimeout(wake.h); wake.h = setTimeout(function () { if (!paused) document.body.classList.remove('awake'); }, 2600); }
  function play(on) { paused = !on; if (on) { var p = film.play(); if (p && p.catch) p.catch(function () {}); } else film.pause(); wake(); }
  function seek(t) { film.currentTime = Math.max(0, Math.min(DUR - 0.02, t)); }
  stage.addEventListener('pointermove', function (e) {
    px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5;
    film.style.transform = 'translate3d(' + (-px * 22).toFixed(1) + 'px,' + (-py * 12).toFixed(1) + 'px,0)';
    wake();
    if (dragging) {
      var dx = e.clientX - dragX;
      if (Math.abs(dx) > 3) moved = true;
      if (moved) seek(dragT + dx / innerWidth * DUR * 1.2);
    }
  });
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('#code')) return;
    dragging = true; moved = false; dragX = e.clientX; dragT = film.currentTime; wasPlaying = !paused;
    stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); film.pause();
  });
  stage.addEventListener('pointerup', function () {
    if (!dragging) return;
    dragging = false; stage.classList.remove('drag');
    play(moved ? wasPlaying : !wasPlaying);                     // a plain click pauses or plays
  });
  document.getElementById('code').addEventListener('wheel', function (e) {
    e.preventDefault();
    userY = (performance.now() < userUntil ? userY : scrollY) + e.deltaY;
    userY = Math.max(0, Math.min(src.length * LINE - viewEl.clientHeight * 0.5, userY));
    userUntil = performance.now() + 3500; wake();
  }, { passive: false });
  addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); play(paused); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); play(false); seek(film.currentTime + (e.key === 'ArrowRight' ? 1 : -1) / FPS); }
    else if (e.key === 'c' || e.key === 'C') { document.body.classList.toggle('film-only'); wake(); }
    else if (e.key >= '1' && e.key <= '7') { seek(BEATS[+e.key - 1].t + 0.01); wake(); }
  });

  // ---------------------------------------------------------- every frame
  var prev = performance.now(), first = true;
  function frame(now) {
    var dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    var t = film.currentTime || 0;
    if (frozen != null && !dragging && paused && Math.abs(t - frozen) > 0.02 && first) t = frozen;
    if (t < lastT - 4) loop++;
    lastT = t;
    showCode(t, dt, first);
    bar.style.transform = 'scaleX(' + (t / DUR).toFixed(4) + ')';
    var edge = Math.min(t, DUR - t);
    dip.style.opacity = paused || dragging ? 0 : (1 - sm(0, 0.28, edge)).toFixed(3);
    mixSound(t, !paused && !dragging);
    first = false;
    requestAnimationFrame(frame);
  }
  window.__state = function () { return { t: film.currentTime, loop: loop, paused: paused, lines: src.length, scrollY: scrollY }; };
  function begin() {
    if (frozen != null) { film.autoplay = false; film.pause(); film.currentTime = frozen; document.body.classList.add('awake'); }
    else { var p = film.play(); if (p && p.catch) p.catch(function () {}); }
    requestAnimationFrame(frame);
  }
  if (film.readyState >= 1) begin(); else { film.addEventListener('loadedmetadata', begin, { once: true }); film.addEventListener('error', begin, { once: true }); }
})();
</script>
</body>
</html>
